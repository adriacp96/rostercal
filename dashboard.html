<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosterCal Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Hide scrollbar for cleaner UI */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    
    /* Prevent text selection when clicking accordions fast */
    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="text-slate-100 min-h-screen bg-slate-950 font-sans flex flex-col selection:bg-blue-500 selection:text-white relative">

  <!-- Header & Navigation -->
  <header class="apple-glass z-50 sticky top-0 border-b border-slate-800 backdrop-blur-md bg-slate-950/80">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 flex items-center justify-center">
          <img src="calendar.png" alt="RosterCal Logo" class="w-8 h-8 object-contain">
        </div>
        <h1 class="text-xl font-extrabold text-white tracking-tight">RosterCal Admin</h1>
      </div>
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition font-medium">← Back to App</a>
    </div>
    
    <!-- Tab Navigation -->
    <div class="max-w-7xl mx-auto px-4 flex space-x-6 text-sm font-medium border-t border-slate-800/50 pt-2 overflow-x-auto no-scrollbar">
      <button id="tab-codes" onclick="switchTab('codes')" class="pb-2 border-b-2 border-blue-500 text-blue-400 cursor-pointer transition whitespace-nowrap">Event Codes</button>
      <button id="tab-rosters" onclick="switchTab('rosters')" class="pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer transition whitespace-nowrap">Parsed Rosters</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

    <!-- VIEW 1: CODES COLLECTION -->
    <div id="view-codes" class="block space-y-6 animate-fade-in">
      
      <!-- Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 shadow">
          <p class="text-[10px] text-slate-400 uppercase font-bold">Total Collected</p>
          <p id="stat-total" class="text-2xl font-extrabold text-blue-400 mt-1">0</p>
        </div>
        <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 shadow">
          <p class="text-[10px] text-slate-400 uppercase font-bold">Unknown (Pending)</p>
          <p id="stat-unknown" class="text-2xl font-extrabold text-amber-400 mt-1">0</p>
        </div>
        <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 shadow">
          <p class="text-[10px] text-slate-400 uppercase font-bold">Total Occurrences</p>
          <p id="stat-occurrences" class="text-2xl font-extrabold text-emerald-400 mt-1">0</p>
        </div>
      </div>

      <!-- Filters & Actions -->
      <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col lg:flex-row justify-between gap-3">
        <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 w-full lg:w-auto">
          <input type="text" id="search-input" placeholder="Search code or description..." class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:border-blue-500 w-full sm:w-64">
          <select id="filter-status" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 w-full sm:w-auto">
            <option value="UNKNOWN" selected>Unknown Only</option>
            <option value="ALL">All Codes</option>
            <option value="KNOWN">Known Only</option>
          </select>
        </div>
        <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-2 w-full lg:w-auto">
          <button id="btn-refresh-codes" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-xl border border-slate-700 transition">↻ Refresh</button>
          <button id="btn-export-json" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-1.5 rounded-xl shadow transition">📥 Export JSON</button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-slate-900/60 rounded-2xl border border-slate-800 overflow-hidden shadow">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse min-w-[600px]">
            <thead>
              <tr class="bg-slate-950 border-b border-slate-800 text-slate-400 text-[10px] uppercase">
                <th class="py-3 px-4">Code</th>
                <th class="py-3 px-4">Title / Description</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-center">Occurrences</th>
                <th class="py-3 px-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="codes-table-body" class="divide-y divide-slate-800">
              <tr>
                <td colspan="5" class="py-12 text-center">
                  <div class="flex flex-col items-center justify-center space-y-2 opacity-60">
                    <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs text-slate-400 font-medium">Loading codes...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- VIEW 2: PARSED ROSTERS -->
    <div id="view-rosters" class="hidden space-y-4 animate-fade-in">
      
      <!-- Rosters Search & Filter Bar -->
      <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col lg:flex-row justify-between gap-3 mb-2">
        <div class="flex flex-col sm:flex-row flex-wrap gap-3 w-full lg:w-auto">
          <input type="text" id="search-rosters" placeholder="Search Staff No..." class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:border-blue-500 w-full sm:w-48">
          <select id="filter-rosters-month" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 w-full sm:w-auto">
            <option value="ALL" selected>All Months</option>
          </select>
          <select id="sort-rosters" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 w-full sm:w-auto">
            <option value="NEWEST" selected>Sort: Newest Uploads</option>
            <option value="OLDEST">Sort: Oldest Uploads</option>
          </select>
        </div>
        <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-2 w-full lg:w-auto justify-end">
          <button id="btn-refresh-rosters" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-xl border border-slate-700 transition w-full sm:w-auto">↻ Fetch Rosters</button>
          <button id="btn-reset-rosters" class="bg-red-900/80 hover:bg-red-700 text-red-200 text-xs px-3 py-1.5 rounded-xl border border-red-800 transition w-full sm:w-auto">🗑️ Reset All Data</button>
        </div>
      </div>

      <!-- Compact Grid Container for Staff Profiles -->
      <div id="rosters-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 items-start">
        <div class="col-span-full flex flex-col items-center justify-center py-12 space-y-2 opacity-60">
          <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-xs text-slate-400 font-medium">Loading rosters...</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = "https://qrwzmbylcgwgteywnjss.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyd3ptYnlsY2d3Z3RleXduanNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjUwMTUsImV4cCI6MjEwMTc0MTAxNX0.Xexca7uxPjvm6orZTecDmfBIyqnpetC_v3b4mtkul9g"; 

    // --- TAB SWITCHING ---
    function switchTab(tab) {
      document.getElementById('view-codes').classList.toggle('hidden', tab !== 'codes');
      document.getElementById('view-codes').classList.toggle('block', tab === 'codes');
      document.getElementById('view-rosters').classList.toggle('hidden', tab !== 'rosters');
      document.getElementById('view-rosters').classList.toggle('block', tab === 'rosters');
      
      const activeClass = "pb-2 border-b-2 border-blue-500 text-blue-400 cursor-pointer transition whitespace-nowrap";
      const inactiveClass = "pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer transition whitespace-nowrap";
      
      document.getElementById('tab-codes').className = tab === 'codes' ? activeClass : inactiveClass;
      document.getElementById('tab-rosters').className = tab === 'rosters' ? activeClass : inactiveClass;
    }

    // --- UTILS ---
    window.toggleAccordion = function(id) {
        const el = document.getElementById(id);
        const icon = document.getElementById('icon-' + id);
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
            icon.innerText = '▼';
        } else {
            el.classList.add('hidden');
            icon.innerText = '▶';
        }
    };

    // Toggle Staff Card Size in Grid
    window.toggleStaffAccordion = function(contentId, cardId) {
        const content = document.getElementById(contentId);
        const card = document.getElementById(cardId);
        
        if (content.classList.contains('hidden')) {
            // Expand to full row
            content.classList.remove('hidden');
            card.classList.remove('col-span-1');
            card.classList.add('col-span-full', 'ring-1', 'ring-blue-500', 'bg-slate-900/80');
        } else {
            // Collapse to grid block
            content.classList.add('hidden');
            card.classList.remove('col-span-full', 'ring-1', 'ring-blue-500', 'bg-slate-900/80');
            card.classList.add('col-span-1');
        }
    };

    // --- DELETION LOGIC (ROSTERS) ---
    async function executeDelete(query, confirmMsg) {
      if (!confirm(confirmMsg)) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/roster_events?${query}`, {
          method: 'DELETE',
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Prefer": "return=minimal"
          }
        });
        
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || "Failed to delete data.");
        }
        await fetchRosters(); // Refresh UI
      } catch (err) {
        console.error("Delete Error:", err);
        alert("Deletion failed: " + err.message);
      }
    }

    window.deleteStaff = function(staffId, event) {
      event.stopPropagation();
      executeDelete(`staff_number=eq.${staffId}`, `⚠️ Are you sure you want to permanently delete ALL rosters for Staff ${staffId}?`);
    };

    window.deleteMonth = function(staffId, monthLabel, sessionIdsStr, event) {
      event.stopPropagation();
      executeDelete(`sync_session_id=in.(${sessionIdsStr})`, `⚠️ Delete all ${monthLabel} rosters for Staff ${staffId}?`);
    };

    window.deleteVersion = function(sessionId, vLabel, event) {
      event.stopPropagation();
      executeDelete(`sync_session_id=eq.${sessionId}`, `⚠️ Delete imported ${vLabel}?`);
    };

    // --- VIEW 1: CODES LOGIC ---
    let allCodes = [];
    async function fetchCodes() {
      const tableBody = document.getElementById('codes-table-body');
      tableBody.innerHTML = `
        <tr>
          <td colspan="5" class="py-12 text-center">
            <div class="flex flex-col items-center justify-center space-y-2 opacity-60">
              <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              <span class="text-xs text-slate-400 font-medium">Loading codes...</span>
            </div>
          </td>
        </tr>`;
      
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/collected_event_codes?select=*&order=occurrence_count.desc`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        allCodes = await res.json();
        updateCodeStats();
        renderCodesTable();
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-500 font-semibold">Failed to fetch event codes.</td></tr>`;
      }
    }

    function updateCodeStats() {
      document.getElementById('stat-total').innerText = allCodes.length;
      document.getElementById('stat-unknown').innerText = allCodes.filter(c => !c.is_known).length;
      document.getElementById('stat-occurrences').innerText = allCodes.reduce((sum, c) => sum + (c.occurrence_count || 1), 0);
    }

    function renderCodesTable() {
      const search = document.getElementById('search-input').value.toUpperCase();
      const filter = document.getElementById('filter-status').value;
      const filtered = allCodes.filter(item => {
        const titleStr = (item.raw_title || "").toUpperCase();
        const matchesSearch = item.code.toUpperCase().includes(search) || titleStr.includes(search);
        const matchesStatus = filter === 'ALL' || (filter === 'UNKNOWN' && !item.is_known) || (filter === 'KNOWN' && item.is_known);
        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        document.getElementById('codes-table-body').innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">No matching codes found.</td></tr>`;
        return;
      }

      document.getElementById('codes-table-body').innerHTML = filtered.map(item => `
        <tr class="hover:bg-slate-800/40">
          <td class="py-3 px-4 font-bold text-blue-300 whitespace-nowrap">${item.code}</td>
          <td class="py-3 px-4 text-slate-300 truncate max-w-[150px] sm:max-w-[200px]" title="${item.raw_title || '-'}">${item.raw_title || '-'}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap ${item.is_known ? 'bg-emerald-950 text-emerald-300' : 'bg-amber-950 text-amber-300'}">
              ${item.is_known ? 'Known' : 'Unknown'}
            </span>
          </td>
          <td class="py-3 px-4 text-center font-bold">${item.occurrence_count || 1}</td>
          <td class="py-3 px-4 text-right">
            <button onclick="toggleKnown('${item.code}', ${!item.is_known})" class="text-[10px] px-2 py-1 rounded bg-slate-800 text-slate-200 border border-slate-700 whitespace-nowrap">
              ${item.is_known ? 'Mark Unknown' : 'Mark Known'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleKnown(code, state) {
      await fetch(`${SUPABASE_URL}/rest/v1/collected_event_codes?code=eq.${code}`, {
        method: 'PATCH',
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ is_known: state })
      });
      fetchCodes();
    }

    document.getElementById('btn-refresh-codes').addEventListener('click', fetchCodes);
    document.getElementById('search-input').addEventListener('input', renderCodesTable);
    document.getElementById('filter-status').addEventListener('change', renderCodesTable);

    // EXPORT JSON LOGIC
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const unknownCodes = allCodes.filter(c => !c.is_known);
      if(unknownCodes.length === 0) {
        alert("No unknown codes available to export.");
        return;
      }
      
      const jsonStructure = {};
      unknownCodes.forEach(c => {
        jsonStructure[c.code] = {
          title: c.raw_title || "Custom Duty",
          emoji: "📌",
          category: "general"
        };
      });

      const blob = new Blob([JSON.stringify(jsonStructure, null, 2)], { type: "application/json" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `unknown_codes_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // --- VIEW 2: ROSTERS LOGIC ---
    let allRosterEvents = [];

    async function fetchRosters() {
      const container = document.getElementById('rosters-container');
      container.innerHTML = `
        <div class="col-span-full flex flex-col items-center justify-center py-12 space-y-2 opacity-60">
          <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span class="text-xs text-slate-400 font-medium">Loading rosters...</span>
        </div>`;
        
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/roster_events?select=*&order=created_at.desc`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        
        allRosterEvents = await res.json();
        
        if (!res.ok) {
          throw new Error(allRosterEvents.message || JSON.stringify(allRosterEvents));
        }

        updateRosterMonthFilter();
        renderRosters();
      } catch (err) {
        console.error("Fetch Rosters Error:", err);
        container.innerHTML = `
          <div class="col-span-full text-center py-8">
            <p class="text-red-500 text-sm font-bold">Error loading rosters!</p>
            <p class="text-slate-400 text-xs mt-2 font-mono">${err.message}</p>
          </div>`;
      }
    }

    async function resetAllRosters() {
      if (!confirm("⚠️ WARNING ⚠️\n\nAre you sure you want to permanently delete ALL parsed rosters from the database? This cannot be undone.")) {
        return;
      }
      
      const container = document.getElementById('rosters-container');
      container.innerHTML = `
        <div class="col-span-full flex flex-col items-center justify-center py-12 space-y-2 opacity-60">
          <svg class="animate-spin h-6 w-6 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span class="text-xs text-slate-400 font-medium">Deleting all roster data...</span>
        </div>`;
      
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/roster_events?id=not.is.null`, {
          method: 'DELETE',
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Prefer": "return=minimal"
          }
        });
        
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || JSON.stringify(errData));
        }

        allRosterEvents = [];
        updateRosterMonthFilter();
        renderRosters();
      } catch (err) {
        console.error("Reset Error:", err);
        alert("Failed to delete rosters: " + err.message);
        fetchRosters();
      }
    }

    function updateRosterMonthFilter() {
        const monthSelect = document.getElementById('filter-rosters-month');
        const currentVal = monthSelect.value;
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        const uniqueMonths = new Set();
        allRosterEvents.forEach(evt => {
            const d = evt.start_utc ? new Date(evt.start_utc) : new Date(evt.created_at);
            const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            uniqueMonths.add(key);
        });

        // Sort months descending (Newest first)
        const sortedMonths = Array.from(uniqueMonths).sort((a, b) => b.localeCompare(a));
        
        let html = `<option value="ALL">All Months</option>`;
        sortedMonths.forEach(mKey => {
            const [y, m] = mKey.split('-');
            const label = `${monthNames[parseInt(m) - 1]} ${y}`;
            html += `<option value="${mKey}">${label}</option>`;
        });
        
        monthSelect.innerHTML = html;
        if (sortedMonths.includes(currentVal)) {
            monthSelect.value = currentVal;
        }
    }

    function renderRosters() {
      const container = document.getElementById('rosters-container');
      container.innerHTML = "";

      if (allRosterEvents.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-slate-500 text-xs py-8">No roster events found in database.</div>`;
        return;
      }

      const search = document.getElementById('search-rosters').value.trim().toUpperCase();
      const monthFilter = document.getElementById('filter-rosters-month').value;
      const sortOrder = document.getElementById('sort-rosters').value;

      // Group by staff_number -> sync_session_id
      const grouped = {};
      allRosterEvents.forEach(evt => {
        const staff = evt.staff_number || "UNKNOWN";
        
        // Apply staff number search filter
        if (search && !staff.toUpperCase().includes(search)) return;

        const session = evt.sync_session_id;

        if (!grouped[staff]) grouped[staff] = { sessions: {} };
        
        if (!grouped[staff].sessions[session]) {
          grouped[staff].sessions[session] = { 
            timestamp: evt.created_at, 
            events: [],
            rosterDate: evt.start_utc ? new Date(evt.start_utc) : new Date(evt.created_at) 
          };
        } else {
           if (evt.start_utc && new Date(evt.start_utc) < grouped[staff].sessions[session].rosterDate) {
               grouped[staff].sessions[session].rosterDate = new Date(evt.start_utc);
           }
        }
        grouped[staff].sessions[session].events.push(evt);
      });

      // Filter sessions by specific month and clean up empty staffs
      Object.keys(grouped).forEach(staffId => {
          const sessions = grouped[staffId].sessions;
          Object.keys(sessions).forEach(sessionId => {
              const d = sessions[sessionId].rosterDate;
              const mKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
              
              if (monthFilter !== 'ALL' && mKey !== monthFilter) {
                  delete sessions[sessionId];
              }
          });
          
          if (Object.keys(sessions).length === 0) {
              delete grouped[staffId];
          }
      });

      const staffIds = Object.keys(grouped);
      
      if (staffIds.length === 0) {
         container.innerHTML = `<div class="col-span-full text-center text-slate-500 text-xs py-8">No rosters match your search/filters.</div>`;
         return;
      }

      // Sort staff by newest or oldest upload
      staffIds.sort((a, b) => {
          const newestA = Math.max(...Object.values(grouped[a].sessions).map(s => new Date(s.timestamp).getTime()));
          const newestB = Math.max(...Object.values(grouped[b].sessions).map(s => new Date(s.timestamp).getTime()));
          return sortOrder === 'NEWEST' ? newestB - newestA : newestA - newestB;
      });

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      staffIds.forEach(staffId => {
        const staffSessions = grouped[staffId].sessions;
        const sessionsByMonth = {};
        
        Object.keys(staffSessions).forEach(sessionId => {
            const sData = staffSessions[sessionId];
            const d = sData.rosterDate;
            const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const monthLabel = `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
            
            if (!sessionsByMonth[monthKey]) {
                sessionsByMonth[monthKey] = { label: monthLabel, sessions: [] };
            }
            sessionsByMonth[monthKey].sessions.push({ id: sessionId, ...sData });
        });

        // Sort months chronologically
        const sortedMonthKeys = Object.keys(sessionsByMonth).sort((a, b) => b.localeCompare(a));

        let monthHtml = sortedMonthKeys.map(mKey => {
            const monthData = sessionsByMonth[mKey];
            
            // Sort versions within the month by import timestamp (Newest first)
            const sortedVersions = monthData.sessions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            const sessionIdsArray = sortedVersions.map(v => v.id).join(','); // Used for month-level deletion
            
            const monthId = `month-${staffId}-${mKey}`;
            
            let versionsHtml = sortedVersions.map((vData, index) => {
                const dateStr = new Date(vData.timestamp).toLocaleString();
                const versionNum = sortedVersions.length - index; // Oldest is v1, newest is highest number
                
                return `
                <div class="mt-3 pl-2 sm:pl-4 border-l-2 border-slate-700">
                  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center text-xs mb-2 space-y-1 sm:space-y-0">
                    <span class="text-slate-400 font-mono font-semibold">Version v${versionNum} <span class="text-slate-500 font-normal ml-1 hidden sm:inline">— Imp: ${dateStr}</span></span>
                    <div class="flex items-center space-x-2 self-start sm:self-auto">
                        <span class="bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded font-medium">${vData.events.length} events</span>
                        <button onclick="deleteVersion('${vData.id}', 'v${versionNum}', event)" class="text-slate-500 hover:text-red-400 hover:bg-red-900/20 px-1.5 py-0.5 rounded transition" title="Delete this version">🗑️</button>
                    </div>
                  </div>
                  <div class="bg-slate-950 border border-slate-800 rounded-lg p-2 max-h-40 overflow-y-auto overflow-x-auto whitespace-nowrap font-mono text-[10px] text-slate-400">
                    ${vData.events.map(e => `[${e.event_code || '??'}] ${e.category || '-'} | ${e.origin || '-'}-${e.destination || '-'} | ${e.start_utc ? e.start_utc.slice(0,10) : ''}`).join('<br>')}
                  </div>
                </div>
                `;
            }).join('');

            return `
            <div class="mt-3 bg-slate-950/50 border border-slate-800 rounded-xl overflow-hidden">
                <button onclick="toggleAccordion('${monthId}')" class="w-full flex justify-between items-center p-3 text-left hover:bg-slate-800/50 transition no-select">
                    <span class="font-bold text-slate-200 text-sm">📅 ${monthData.label}</span>
                    <div class="flex items-center space-x-2 sm:space-x-3">
                        <span class="text-[10px] sm:text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">${sortedVersions.length} Version(s)</span>
                        <button onclick="deleteMonth('${staffId}', '${monthData.label}', '${sessionIdsArray}', event)" class="text-slate-500 hover:text-red-400 hover:bg-red-900/20 px-1.5 py-0.5 rounded transition" title="Delete this entire month">🗑️</button>
                        <span id="icon-${monthId}" class="text-slate-500 text-xs ml-1">▶</span>
                    </div>
                </button>
                <div id="${monthId}" class="hidden p-3 pt-0 border-t border-slate-800">
                    ${versionsHtml}
                </div>
            </div>
            `;
        }).join('');

        const totalUploads = Object.keys(staffSessions).length;
        const staffContainerId = `staff-${staffId}`;
        const cardId = `card-${staffId}`;
        
        const staffCard = document.createElement('div');
        staffCard.id = cardId;
        staffCard.className = "col-span-1 bg-slate-900/60 rounded-xl border border-slate-800 overflow-hidden shadow transition-all duration-300 flex flex-col";
        staffCard.innerHTML = `
          <button onclick="toggleStaffAccordion('${staffContainerId}', '${cardId}')" class="w-full relative p-5 hover:bg-slate-800/50 transition no-select flex flex-col items-center justify-center text-center h-full">
            <div class="absolute top-2 right-2">
                <button onclick="deleteStaff('${staffId}', event)" class="text-slate-500 hover:text-red-400 hover:bg-red-900/20 p-1.5 rounded transition" title="Delete ALL rosters for this staff">🗑️</button>
            </div>
            <div class="bg-blue-900/30 text-blue-400 w-12 h-12 rounded-full flex items-center justify-center text-2xl mb-3 shadow-inner ring-1 ring-blue-500/20">
                👤
            </div>
            <h3 class="font-bold text-white text-lg tracking-tight">${staffId}</h3>
            <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-semibold mt-2 shadow-sm">${totalUploads} Upload(s)</span>
          </button>
          <div id="${staffContainerId}" class="hidden p-4 pt-0 border-t border-slate-800 bg-slate-900/30 text-left w-full">
            <div class="pt-2">
              <h4 class="text-xs font-bold text-slate-400 uppercase tracking-tight mb-2">Roster History</h4>
              ${monthHtml}
            </div>
          </div>
        `;
        container.appendChild(staffCard);
      });
    }

    // Attach listeners
    document.getElementById('btn-refresh-rosters').addEventListener('click', fetchRosters);
    document.getElementById('btn-reset-rosters').addEventListener('click', resetAllRosters);
    document.getElementById('search-rosters').addEventListener('input', renderRosters);
    document.getElementById('filter-rosters-month').addEventListener('change', renderRosters);
    document.getElementById('sort-rosters').addEventListener('change', renderRosters);

    // Initial load
    fetchCodes();
    fetchRosters();
  </script>
</body>
</html>
